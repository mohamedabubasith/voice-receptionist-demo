[project]
name = "dental-clinic-voice-agent"
version = "0.1.0"
description = "A clean modular LiveKit voice agent receptionist (Priya) for a dental clinic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=0.8.0",
    "livekit-plugins-openai>=0.8.0",
    "livekit-plugins-deepgram>=0.8.0",
    "livekit-plugins-silero>=0.8.0",
    "livekit-plugins-noise-cancellation>=0.2.0",
    "livekit-plugins-elevenlabs>=0.8.0",
    "livekit-plugins-cartesia>=0.8.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",
]

[tool.uv]
managed = true
